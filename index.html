<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Prize Claw</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="machine" aria-labelledby="gameTitle">
		<header class="topbar">
			<div>
				<p class="eyebrow">Lucky drop arcade</p>
				<h1 id="gameTitle">Prize Claw</h1>
			</div>
			<div class="score" aria-label="Prize score"><span id="score">0</span><small>WINS</small></div>
		</header>

		<section class="game-cabinet" aria-label="Claw machine game">
			<div class="machine-top"><span></span><span></span><span></span></div>
			<div class="playfield" id="playfield">
				<div class="rail"></div>
				<div class="claw" id="claw" aria-hidden="true"><div class="cable"></div><div class="grabber"><i></i><i></i><i></i></div></div>
				<div class="prizes" id="prizes"></div>
				<div class="floor"></div>
			</div>
			<div class="controls">
				<div class="status" id="status" role="status">Pick a prize and make your drop.</div>
				<div class="control-row">
					<button class="arrow-button" id="leftButton" type="button" aria-label="Move claw left">&#8592;</button>
					<button class="drop-button" id="dropButton" type="button">Drop claw</button>
					<button class="arrow-button" id="rightButton" type="button" aria-label="Move claw right">&#8594;</button>
				</div>
			</div>
		</section>
		<p class="hint">Use the arrow keys to aim. Each drop costs one play.</p>
	</main>

	<script src="script.js"></script>
</body>
</html>
