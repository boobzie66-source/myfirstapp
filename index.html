<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My To-Do App</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="container">

        <p class="eyebrow">Today&rsquo;s focus</p>
		<h1>To-Do List</h1>
		<p class="intro">A clear little space for what matters next.</p>

		<form id="taskForm">
			<label class="sr-only" for="taskInput">Enter a task</label>
			<input type="text" id="taskInput" placeholder="Enter a task" autocomplete="off" maxlength="120">
			<button class="primary-button" type="submit">Add task</button>
		</form>

		<section class="list-section" aria-labelledby="listHeading">
			<div class="list-header">
				<h2 id="listHeading">Your tasks</h2>
				<span id="taskCount">0 tasks</span>
			</div>
			<div class="toolbar" aria-label="Task filters">
				<div class="filters" role="group" aria-label="Show tasks">
					<button class="filter-button active" type="button" data-filter="all">All</button>
					<button class="filter-button" type="button" data-filter="active">Active</button>
					<button class="filter-button" type="button" data-filter="completed">Done</button>
				</div>
				<button class="clear-button" id="clearCompleted" type="button">Clear done</button>
			</div>
			<ul id="taskList"></ul>
			<p id="emptyState" class="empty-state">Nothing here yet. Add your first task.</p>
		</section>
	</main>

	<script src="script.js"></script>
</body>
</html>
